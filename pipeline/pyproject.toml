[project]
name = "book-pipeline"
version = "0.1.0"
description = "Curate, validate and publish order book data recorded by book-recorder (Polymarket, Kalshi)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=17",
    "huggingface_hub>=0.25",
    "zstandard>=0.23",
    "pyyaml>=6",
    "orjson>=3.10",
    "tzdata; sys_platform == 'win32'",  # pyarrow needs a tz database to turn UTC timestamps into datetimes
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
book-pipeline = "book_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[package]
name = "book-recorder"
version = "0.1.0"
edition = "2021"
description = "Records Polymarket and Kalshi order book data to hourly zstd NDJSON segments and ships them to S3."
license = "MIT"

[[bin]]
name = "book-recorder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusty-s3 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
